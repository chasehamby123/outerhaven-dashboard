<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Outerhaven Partner Access</title>
  <style>
    @import url('/outerhaven-theme.css');
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f3efe8;color:#171511;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;padding:24px}.card{width:min(620px,100%);background:#fffdf9;border:1px solid #ddd1c2;border-radius:22px;padding:34px;box-shadow:0 24px 70px rgba(45,35,24,.10)}.mark{width:44px;height:44px;border-radius:12px;background:#171511;color:#f0dfc7;display:grid;place-items:center;font-family:Georgia,serif;font-weight:900}.eyebrow{margin-top:26px;font-size:10px;letter-spacing:.14em;color:#8b765f;font-weight:850}.card h1{font-size:30px;letter-spacing:-.04em;margin:7px 0 9px}.lead{font-size:14px;line-height:1.65;color:#6f675e;margin:0 0 22px}.statusBox{background:#f7f1e8;border:1px solid #dfcfbb;border-radius:13px;padding:15px 16px;margin:18px 0}.statusBox span{display:block;font-size:10px;color:#887764;font-weight:800;text-transform:uppercase;letter-spacing:.08em}.statusBox strong{display:block;font-size:17px;margin-top:5px}.details{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.detail{border:1px solid #e5dbce;border-radius:11px;padding:12px}.detail span{display:block;font-size:10px;color:#8c8379;text-transform:uppercase;font-weight:800}.detail b{display:block;font-size:13px;margin-top:4px;overflow-wrap:anywhere}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:24px}.primary,.ghost{border-radius:10px;padding:10px 14px;font:inherit;font-size:12px;font-weight:800;cursor:pointer}.primary{border:1px solid #171511;background:#171511;color:#fffaf3}.ghost{border:1px solid #cfbda6;background:#fffdf9;color:#4d4338}.msg{font-size:12px;color:#8a4b42;margin-top:12px;min-height:18px}@media(max-width:560px){.card{padding:26px}.details{grid-template-columns:1fr}.card h1{font-size:27px}}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">H</div>
    <div class="eyebrow">OUTERHAVEN PARTNER NETWORK</div>
    <h1 id="headline">Access request under review</h1>
    <p id="copy" class="lead">Your account is active, but submissions and buyer mandates stay locked until Outerhaven approves your partner access.</p>
    <div class="statusBox"><span>Account status</span><strong id="status">Checking...</strong></div>
    <div class="details">
      <div class="detail"><span>Name</span><b id="name">—</b></div>
      <div class="detail"><span>Firm</span><b id="firm">—</b></div>
      <div class="detail"><span>Email</span><b id="email">—</b></div>
      <div class="detail"><span>Membership</span><b id="membership">—</b></div>
    </div>
    <div class="actions"><button id="refresh" class="primary">Refresh Status</button><button id="signOut" class="ghost">Sign Out</button></div>
    <div id="msg" class="msg"></div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script>
  <script src="/originator-pending.js"></script>
</body>
</html>
