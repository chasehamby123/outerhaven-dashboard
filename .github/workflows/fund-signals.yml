# Fund signals + credit signals: reads SEC data with edgartools and sends it to HQ (Pipeline → Fund signals / Credit signals).
# Free (public repo). Needs two repository secrets (Settings → Secrets and variables → Actions → New repository secret):
#   FUND_INGEST_KEY  copy it from HQ → Pipeline → Fund signals → Settings
#   SEC_IDENTITY     your name and email, e.g. "OuterHaven Advisory ops@yourdomain.com" (the SEC asks every tool to identify itself)
name: Fund signals

on:
  schedule:
    - cron: "40 1 * * *"   # daily 09:40 MYT: new Fund II/III filings, the Fund I window turning 3.5 years, checks
    - cron: "10 * * * *"   # hourly: Fund II checks queued from HQ
  workflow_dispatch:
    inputs:
      mode:
        description: "daily | live | fund1 | check | recheck | credit | probe"
        default: daily
        required: true
      from:
        description: "Start date YYYY-MM-DD (live / fund1 backfills); probe: names separated by ;"
        required: false
      to:
        description: "End date YYYY-MM-DD"
        required: false

# No concurrency group: GitHub keeps only ONE pending run per group and cancels the rest, which silently dropped
# queued backfills (2 Oct 2026). Runs may now overlap, so each is capped at 4 SEC requests/s (SEC allows 10/s in total).

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements-fund-signals.txt
      - run: pip install -r scripts/requirements-fund-signals.txt
      - name: Run
        env:
          FUND_INGEST_KEY: ${{ secrets.FUND_INGEST_KEY }}
          EDGAR_RATE_LIMIT_PER_SEC: "4"
          SEC_IDENTITY: ${{ secrets.SEC_IDENTITY }}
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          IN_MODE: ${{ github.event.inputs.mode }}
          IN_FROM: ${{ github.event.inputs.from }}
          IN_TO: ${{ github.event.inputs.to }}
        run: |
          if [ "$EVENT" = "schedule" ]; then
            if [ "$SCHEDULE" = "10 * * * *" ]; then MODE=check; else MODE=daily; fi
          else
            MODE="$IN_MODE"
          fi
          case "$MODE" in daily|live|fund1|check|recheck|credit|probe) ;; *) echo "mode must be daily, live, fund1, check, recheck, credit or probe"; exit 1;; esac
          if [ "$MODE" = "credit" ]; then python scripts/credit_signals.py; exit $?; fi
          set -- --mode "$MODE"
          if [ "$MODE" = "probe" ]; then python scripts/fund_signals.py --mode probe --from "$IN_FROM"; exit $?; fi
          if [[ "$IN_FROM" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then set -- "$@" --from "$IN_FROM"; fi
          if [[ "$IN_TO" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then set -- "$@" --to "$IN_TO"; fi
          python scripts/fund_signals.py "$@"
          # The daily run also refreshes credit signals (public companies that need private credit).
          if [ "$MODE" = "daily" ]; then python scripts/credit_signals.py; fi
