<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Outerhaven · Information Request</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f4f1ed;color:#211d19;font-family:Arial,Helvetica,sans-serif}main{min-height:100vh;display:grid;place-items:center;padding:28px}.card{width:min(650px,100%);background:#fff;border:1px solid #ddd4ca;border-radius:22px;box-shadow:0 24px 70px rgba(28,23,18,.08);overflow:hidden}.top{padding:27px 30px 21px;border-bottom:1px solid #eee8e1}.brand{font:800 8px/1 Arial;letter-spacing:.17em;text-transform:uppercase;color:#8d765d}.deal{margin:8px 0 3px;font:700 26px/1.08 Arial;letter-spacing:-.03em}.sub{font:400 10px/1.5 Arial;color:#796e64}.body{padding:28px 30px 31px}.ey{font:800 7px/1 Arial;letter-spacing:.13em;text-transform:uppercase;color:#987b59}.body h1{margin:7px 0 8px;font:650 20px/1.22 Arial}.prompt{margin:0 0 17px;font:400 11px/1.65 Arial;color:#544b43}.input{width:100%;min-height:118px;resize:vertical;border:1px solid #d8cec4;border-radius:12px;padding:13px 14px;background:#fcfbf9;color:#211d19;font:500 12px/1.55 Arial;outline:none}.input:focus{border-color:#9e866b;box-shadow:0 0 0 3px rgba(158,134,107,.12)}.actions{display:flex;gap:8px;align-items:center;margin-top:12px}.btn{border:0;border-radius:10px;padding:11px 15px;background:#211d19;color:#fff;font:800 9px/1 Arial;cursor:pointer}.btn:disabled{opacity:.55;cursor:wait}.help{font:400 8.5px/1.45 Arial;color:#8b8075}.status{padding:18px;border-radius:13px;background:#eef3ef;color:#315943}.status strong{display:block;margin-bottom:5px;font-size:15px}.status p{margin:0;font-size:10px;line-height:1.55}.error{background:#faf0ed;color:#744b41}.foot{padding:14px 30px;border-top:1px solid #eee8e1;font:700 7px/1.4 Arial;letter-spacing:.06em;text-transform:uppercase;color:#998d81}@media(max-width:600px){main{padding:14px}.top,.body{padding-left:20px;padding-right:20px}.deal{font-size:23px}.actions{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
<main>
  <section class="card">
    <header class="top">
      <div class="brand">OUTERHAVEN · PRIVATE INFORMATION REQUEST</div>
      <div id="dealName" class="deal">Loading request…</div>
      <div class="sub">A short factual answer is sufficient. You do not need an Outerhaven account.</div>
    </header>
    <div id="requestBody" class="body"><div class="status"><strong>Opening secure request…</strong><p>Please wait a moment.</p></div></div>
    <footer class="foot">Private & Confidential · Request link expires automatically</footer>
  </section>
</main>
<script src="/capital-request.js"></script>
</body>
</html>
