<!-- Supabase → Authentication → Emails → Reset password. Subject: Reset your Outerhaven HQ password -->
<table width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f2;padding:40px 16px;font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <tr><td align="center">
    <table width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border:1px solid #e4e4e0">
      <tr><td style="padding:28px 32px;border-bottom:1px solid #e4e4e0">
        <span style="font-family:Georgia,serif;font-size:20px;color:#111">Outerhaven</span>
        <span style="font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#888;margin-left:8px">HQ</span>
      </td></tr>
      <tr><td style="padding:32px">
        <p style="margin:0 0 12px;font-size:18px;color:#111">Reset your password</p>
        <p style="margin:0 0 24px;font-size:14px;line-height:1.6;color:#444">We received a request to reset the password for {{ .Email }}. The link below is valid for one hour.</p>
        <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#111;color:#fff;text-decoration:none;font-size:14px;padding:12px 22px">Choose a new password</a>
        <p style="margin:24px 0 0;font-size:12px;line-height:1.6;color:#888">If you didn't ask for this, you can ignore this email. Your password won't change.</p>
      </td></tr>
      <tr><td style="padding:18px 32px;border-top:1px solid #e4e4e0;font-size:11px;color:#999">Outerhaven · Internal use only</td></tr>
    </table>
  </td></tr>
</table>
