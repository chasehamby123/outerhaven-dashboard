<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Partner Password | Outerhaven</title><style>@import url('/outerhaven-theme.css');*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f2eadf;color:#201d18;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;padding:24px}.card{width:min(440px,100%);background:#fffaf3;border:1px solid #d8c6b1;border-radius:18px;padding:30px;box-shadow:0 24px 70px rgba(49,37,25,.1)}.mark{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:#171511;color:#f2eadf;font-weight:900;margin-bottom:22px}.eyebrow{font-size:8px;font-weight:900;letter-spacing:.12em;color:#8a7865}.card h1{font-size:24px;letter-spacing:-.035em;margin:6px 0}.card>p{font-size:10px;color:#786f64;line-height:1.55;margin:0 0 18px}label{display:grid;gap:6px;font-size:9px;font-weight:800;color:#5f554b;margin-top:12px}input{width:100%;border:1px solid #d8c6b1;border-radius:9px;padding:10px 11px;font:inherit;font-size:11px;background:#fff;outline:0}input:focus{border-color:#b8956f;box-shadow:0 0 0 3px rgba(184,149,111,.12)}button{width:100%;margin-top:18px;border:1px solid #171511;background:#171511;color:#fffaf3;border-radius:9px;padding:10px;font-size:10px;font-weight:850;cursor:pointer}button:disabled{opacity:.55}.msg{display:none;margin-top:12px;padding:9px 10px;border-radius:9px;font-size:9px;line-height:1.5}.msg.show{display:block}.msg.error{background:#fff0ed;border:1px solid #e7c6bd;color:#993e31}.msg.good{background:#eef7f1;border:1px solid #c9dfd0;color:#286d49}.back{display:block;text-align:center;margin-top:15px;color:#6d6155;font-size:9px;font-weight:750;text-decoration:none}</style></head><body><main class="card"><div class="mark">H</div><div class="eyebrow">PARTNER ACCESS</div><h1>Choose a new password</h1><p>Enter a new password for your Outerhaven partner account.</p><form id="passwordForm"><label>New Password<input id="newPassword" type="password" minlength="8" required autocomplete="new-password"></label><label>Confirm Password<input id="confirmPassword" type="password" minlength="8" required autocomplete="new-password"></label><button id="savePassword" type="submit">Update Password</button></form><div id="passwordMsg" class="msg"></div><a class="back" href="/originator-login.html?mode=signin">Back to Partner Sign In</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/originator-update-password.js"></script></body></html>
