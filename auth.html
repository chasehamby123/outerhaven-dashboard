<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Outerhaven Team Login</title><style>:root{--bg:#f5f6f8;--card:#fff;--text:#15171a;--muted:#6f7680;--border:#e2e5e9;--dark:#111318;--soft:#f4f5f7}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);display:grid;place-items:center;padding:24px}.card{width:min(440px,100%);background:var(--card);border:1px solid var(--border);border-radius:20px;padding:28px;box-shadow:0 20px 60px rgba(15,23,42,.08)}.brand{display:flex;align-items:center;gap:12px;margin-bottom:28px}.mark{width:40px;height:40px;border-radius:12px;background:var(--dark);color:#fff;display:grid;place-items:center;font-weight:800}.brandName{font-weight:800}.brandSub{font-size:12px;color:var(--muted);margin-top:2px}h1{font-size:25px;letter-spacing:-.03em;margin:0}p{color:var(--muted);font-size:13px;line-height:1.55;margin:8px 0 20px}.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);padding:4px;border-radius:11px;margin-bottom:20px}.tab{display:block;text-align:center;text-decoration:none;border:0;background:transparent;padding:9px;border-radius:8px;color:var(--muted);font-weight:650;font-size:14px}.tab.active{background:#fff;color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.06)}label{display:block;font-size:12px;font-weight:650;margin:14px 0 0}input{width:100%;margin-top:7px;border:1px solid #d3d7dc;border-radius:10px;padding:11px 12px;font:inherit;outline:0}input:focus{border-color:#9097a1;box-shadow:0 0 0 3px rgba(17,24,39,.05)}.hint{font-size:11px;color:var(--muted);margin-top:6px}.btn{width:100%;margin-top:18px;border:1px solid var(--dark);background:var(--dark);color:#fff;border-radius:10px;padding:11px 14px;font-weight:750;cursor:pointer}.btn:disabled{opacity:.55;cursor:wait}.msg{display:none;margin-top:14px;border-radius:10px;padding:11px 12px;font-size:12px;line-height:1.45}.msg.show{display:block}.msg.error{background:#fef3f2;color:#a12920;border:1px solid #f4cac6}.msg.good{background:#edf8f3;color:#176843;border:1px solid #c9e9d9}.allowed{margin-top:20px;padding-top:18px;border-top:1px solid var(--border);font-size:11px;color:var(--muted)}.allowed strong{color:#454b53}</style></head><body><main class="card"><div class="brand"><div class="mark">O</div><div><div class="brandName">Outerhaven</div><div class="brandSub">Shared Opportunity Board</div></div></div><h1>Sign in</h1><p>Use your Outerhaven team account to access the shared dashboard.</p><div class="tabs"><a class="tab active" href="/auth.html">Sign In</a><a class="tab" href="/create-account.html">Create Account</a></div><form id="form"><label>Email<input id="email" type="email" autocomplete="email" required placeholder="chasehamby@chproduction.org"></label><label>Password<input id="password" type="password" autocomplete="current-password" minlength="8" required placeholder="Enter your password"></label><div class="hint">No account yet? Click “Create Account” above and choose your password.</div><button id="submitBtn" class="btn" type="submit">Sign In</button><div id="msg" class="msg"></div></form><div class="allowed">Access is limited to approved team emails.</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const SB_URL='https://nfcysxqdwpdhrdpgxrlo.supabase.co',SB_KEY='sb_publishable_nBRZvesX4tz7zUPq5QLYfQ__in76dF5';const client=supabase.createClient(SB_URL,SB_KEY);const form=document.getElementById('form'),msg=document.getElementById('msg'),submitBtn=document.getElementById('submitBtn');function show(text,type='error'){msg.textContent=text;msg.className='msg show '+type}async function allowed(email){const {data,error}=await client.rpc('is_dashboard_email_allowed',{input_email:email});if(error)throw error;return data===true}client.auth.getSession().then(({data})=>{if(data.session)location.replace('/shared.html')});form.addEventListener('submit',async e=>{e.preventDefault();msg.className='msg';const email=document.getElementById('email').value.trim().toLowerCase(),password=document.getElementById('password').value;if(password.length<8){show('Enter your password.');return}submitBtn.disabled=true;submitBtn.textContent='Signing in...';try{if(!(await allowed(email))){show('That email is not approved for this dashboard.');return}const {error}=await client.auth.signInWithPassword({email,password});if(error)throw error;show('Signed in. Opening dashboard...','good');setTimeout(()=>location.replace('/shared.html'),250)}catch(err){show(err?.message||'Could not sign in.')}finally{submitBtn.disabled=false;submitBtn.textContent='Sign In'}});</script></body></html>
