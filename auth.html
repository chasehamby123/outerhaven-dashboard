<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Outerhaven Team Login</title><style>:root{--bg:#f5f6f8;--card:#fff;--text:#15171a;--muted:#6f7680;--border:#e2e5e9;--dark:#111318;--soft:#f4f5f7}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);display:grid;place-items:center;padding:24px}.card{width:min(440px,100%);background:var(--card);border:1px solid var(--border);border-radius:20px;padding:28px;box-shadow:0 20px 60px rgba(15,23,42,.08)}.brand{display:flex;align-items:center;gap:12px;margin-bottom:28px}.mark{width:40px;height:40px;border-radius:12px;background:var(--dark);color:#fff;display:grid;place-items:center;font-weight:800}.brandName{font-weight:800}.brandSub{font-size:12px;color:var(--muted);margin-top:2px}h1{font-size:25px;letter-spacing:-.03em;margin:0}p{color:var(--muted);font-size:13px;line-height:1.55;margin:8px 0 20px}.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);padding:4px;border-radius:11px;margin-bottom:20px}.tab{border:0;background:transparent;padding:9px;border-radius:8px;color:var(--muted);font-weight:650}.tab.active{background:#fff;color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.06)}label{display:block;font-size:12px;font-weight:650;margin:14px 0 0}input{width:100%;margin-top:7px;border:1px solid #d3d7dc;border-radius:10px;padding:11px 12px;font:inherit;outline:0}input:focus{border-color:#9097a1;box-shadow:0 0 0 3px rgba(17,24,39,.05)}.hint{font-size:11px;color:var(--muted);margin-top:6px}.btn{width:100%;margin-top:18px;border:1px solid var(--dark);background:var(--dark);color:#fff;border-radius:10px;padding:11px 14px;font-weight:750;cursor:pointer}.btn:disabled{opacity:.55;cursor:wait}.msg{display:none;margin-top:14px;border-radius:10px;padding:11px 12px;font-size:12px;line-height:1.45}.msg.show{display:block}.msg.error{background:#fef3f2;color:#a12920;border:1px solid #f4cac6}.msg.good{background:#edf8f3;color:#176843;border:1px solid #c9e9d9}.allowed{margin-top:20px;padding-top:18px;border-top:1px solid var(--border);font-size:11px;color:var(--muted)}.allowed strong{color:#454b53}</style></head><body><main class="card"><div class="brand"><div class="mark">O</div><div><div class="brandName">Outerhaven</div><div class="brandSub">Shared Opportunity Board</div></div></div><h1 id="heading">Sign in</h1><p id="copy">Use your Outerhaven team account to access the shared dashboard.</p><div class="tabs"><button id="loginTab" class="tab active" type="button">Sign In</button><button id="createTab" class="tab" type="button">Create Account</button></div><form id="form"><label>Email<input id="email" type="email" autocomplete="email" required placeholder="chasehamby@chproduction.org"></label><label id="passwordLabel">Password<input id="password" type="password" autocomplete="current-password" minlength="8" required placeholder="Enter your password"></label><div id="passwordHint" class="hint">If you have not created an account yet, choose “Create Account” above.</div><button id="submitBtn" class="btn" type="submit">Sign In</button><div id="msg" class="msg"></div></form><div class="allowed">Access is currently limited to approved team emails. <strong>You create your own password the first time.</strong></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const URL='https://nfcysxqdwpdhrdpgxrlo.supabase.co',KEY='sb_publishable_nBRZvesX4tz7zUPq5QLYfQ__in76dF5',sb=supabase.createClient(URL,KEY);let mode='login';const $=id=>document.getElementById(id),loginTab=$('loginTab'),createTab=$('createTab'),heading=$('heading'),copy=$('copy'),password=$('password'),passwordLabel=$('passwordLabel'),passwordHint=$('passwordHint'),submitBtn=$('submitBtn'),msg=$('msg');function show(text,type='error'){msg.textContent=text;msg.className='msg show '+type}function clear(){msg.className='msg';msg.textContent=''}function setMode(next){mode=next;clear();loginTab.classList.toggle('active',mode==='login');createTab.classList.toggle('active',mode==='create');if(mode==='create'){heading.textContent='Create your account';copy.textContent='Choose a password for your approved Outerhaven email. This is the password you will use going forward.';passwordLabel.firstChild.textContent='Choose Password';password.placeholder='Choose at least 8 characters';password.autocomplete='new-password';passwordHint.textContent='You are creating the password now. There is no pre-existing password.';submitBtn.textContent='Create Account'}else{heading.textContent='Sign in';copy.textContent='Use your Outerhaven team account to access the shared dashboard.';passwordLabel.firstChild.textContent='Password';password.placeholder='Enter your password';password.autocomplete='current-password';passwordHint.textContent='If you have not created an account yet, choose “Create Account” above.';submitBtn.textContent='Sign In'}}loginTab.onclick=()=>setMode('login');createTab.onclick=()=>setMode('create');async function allowed(email){const {data,error}=await sb.rpc('is_dashboard_email_allowed',{input_email:email});if(error)throw error;return data===true}async function goIfSession(){const {data:{session}}=await sb.auth.getSession();if(session){location.replace('/shared.html')}}goIfSession();$('form').onsubmit=async e=>{e.preventDefault();clear();const email=$('email').value.trim().toLowerCase(),pw=password.value;if(!email){show('Enter your approved team email.');return}if(pw.length<8){show(mode==='create'?'Choose a password with at least 8 characters.':'Enter your password.');return}submitBtn.disabled=true;submitBtn.textContent=mode==='create'?'Creating...':'Signing in...';try{if(!(await allowed(email))){show('That email is not approved for this dashboard.');return}if(mode==='create'){const {data,error}=await sb.auth.signUp({email,password:pw,options:{data:{full_name:email.startsWith('chase')?'Chase Hamby':'Tengku'},emailRedirectTo:'https://outerhaven-dashboard.vercel.app/shared.html'}});if(error)throw error;if(data.session){show('Account created. Opening the dashboard...','good');setTimeout(()=>location.replace('/shared.html'),500)}else{show('Account created. Check your email for the Supabase confirmation message, confirm it, then come back and sign in.','good');setMode('login')}}else{const {error}=await sb.auth.signInWithPassword({email,password:pw});if(error)throw error;show('Signed in. Opening the dashboard...','good');setTimeout(()=>location.replace('/shared.html'),350)}}catch(err){show(err?.message||'Something went wrong. Try again.')}finally{submitBtn.disabled=false;submitBtn.textContent=mode==='create'?'Create Account':'Sign In'}};</script></body></html>
